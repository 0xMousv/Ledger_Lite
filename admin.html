<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8fa"><title>Ledger Lite | Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{background:#f5f6f9;min-height:100vh}.admin-wrap{width:min(720px,calc(100% - 32px));margin:55px auto}
.admin-card{background:#fff;border:1px solid #e8eaf0;border-radius:16px;padding:30px;box-shadow:0 18px 55px #2428380d}
.admin-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.admin-head h1{font-size:23px;margin:0}.admin-head p{font-size:11px;color:#9297a3;margin:5px 0 0}
.field{display:grid;gap:7px;margin:16px 0}.field label{color:#50576a;font-size:11px;font-weight:700}
.field input,.field textarea{width:100%;border:1px solid #e3e6ed;border-radius:8px;padding:12px;font:12px Cairo;background:#fff;color:#202536;outline:none}
.field input:focus,.field textarea:focus{border-color:#7885ec;box-shadow:0 0 0 3px #7885ec18}
.field textarea{min-height:90px;resize:vertical}.admin-actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
.admin-btn{border:0;cursor:pointer;font:700 12px Cairo;padding:12px 18px;border-radius:8px;background:#242838;color:white}.admin-btn.secondary{background:#eef0f6;color:#34394b}
.status{font-size:11px;color:#858b99;margin-top:14px;min-height:20px}.hidden{display:none!important}
.pill{font-size:10px;padding:6px 10px;border-radius:20px;background:#eef0ff;color:#6574df}
.warning{background:#fff8e8;color:#8a6b25;padding:12px;border-radius:8px;font-size:10px;line-height:1.9;margin-top:15px}
@media(max-width:600px){.admin-card{padding:20px}.admin-head{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head>
<body><main class="admin-wrap"><section class="admin-card">
<div class="admin-head"><div><a class="brand" href="index.html"><b class="mark">L</b><span>LEDGER <i>LITE</i></span></a><h1 style="margin-top:20px">لوحة إدارة البرنامج</h1><p>تحديث رابط التحميل وبيانات الإصدار المنشور</p></div><span class="pill">ADMIN AREA</span></div>
<form id="loginForm">
<div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"></div>
<div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required placeholder="كلمة مرور حساب Firebase"></div>
<button class="admin-btn" type="submit">تسجيل الدخول</button>
</form>
<div id="editor" class="hidden">
<div class="field"><label for="downloadUrl">رابط تحميل البرنامج (HTTPS)</label><input id="downloadUrl" type="url" placeholder="https://..."></div>
<div class="field"><label for="version">رقم الإصدار</label><input id="version" type="text" placeholder="1.0.0"></div>
<div class="field"><label for="releaseNotes">ملاحظات التحديث</label><textarea id="releaseNotes" placeholder="اكتب أهم التغييرات في هذا الإصدار"></textarea></div>
<div class="admin-actions"><button class="admin-btn" id="saveBtn" type="button">حفظ ونشر التحديث</button><button class="admin-btn secondary" id="logoutBtn" type="button">تسجيل الخروج</button></div>
</div>
<p class="status" id="status" role="status"></p>
<div class="warning">ملاحظة إعداد: أنشئ حساب الأدمن في Firebase Authentication بالبريد المصرّح به، ثم طبّق قواعد Firestore الموجودة في ملف firestore.rules. لا تضع كلمة المرور داخل ملفات الموقع.</div>
</section></main><script type="module" src="admin.js"></script></body></html>
